image: registry.gitlab.com/substrakt/baseproject:latest

services:
  - mysql:5.7.21

variables:
  MYSQL_DATABASE: "wordpress"
  MYSQL_ROOT_PASSWORD: "root"

stages:
  - test

# Job to run phpunit to run all test in the Childtheme.
test app:
  stage: test
  before_script:
    - composer install --no-progress --no-scripts --no-suggest --ignore-platform-reqs
  script:
    - ./vendor/bin/phpunit --colors=never
