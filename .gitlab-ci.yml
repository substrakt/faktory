image: registry.gitlab.com/substrakt/baseproject:latest

# Select what we should cache between builds
cache:
  paths:
    - vendor

stages:
  - test

test app:
  stage: test
  before_script:
    - composer install --no-progress --no-scripts --no-suggest --ignore-platform-reqs
  script:
    - - vendor/bin/phpunit --configuration phpunit.xml --coverage-text --colors=never
